<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi madrileña ❤️</title>
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Archivo CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Un ratito contigo cada día 💌</h1>
        <p>Una nota y una canción para ti, de Despeñaperros pa'rriba.</p>
    </header>

    <!-- NOTA DEL DÍA -->
    <main class="card" id="todayNoteCard">
        <div class="date-badge" id="noteDate">Cargando...</div>
        <h2 class="note-title" id="noteTitle">...</h2>
        <p class="note-text" id="noteText">Cargando el mensaje del día...</p>
        
        <div class="song-container" id="songContainer">
            <!-- Reproductor de Spotify -->
        </div>
    </main>

    <!-- HISTORIAL DE DÍAS ANTERIORES -->
    <h3 class="past-notes-title">Notas de días anteriores</h3>
    <div class="past-list" id="pastList">
        <!-- Generado dinámicamente desde script.js -->
    </div>

    <footer>
        Hecho con ❤️ especialmente para Irene
    </footer>
</div>

<!-- Archivo JavaScript -->
<script src="js/script.js"></script>
</body>
</html>
